[package]
name = "nanfeng-knowledge-base"
version = "0.2.0"
description = "南枫知识库：本地知识档案与判断版本库"
authors = ["南烛枫"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nanfeng_knowledge_base_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ammonia = "4.1.4"
chrono = { version = "0.4.45", features = ["serde"] }
encoding_rs = "0.8.35"
fs2 = "0.4.3"
hex = "0.4.3"
open = { version = "5.4.0", features = ["shellexecute-on-windows"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled", "chrono", "serde_json"] }
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.23.0"
