<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据与存储窗口前后对比</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        color: #173d6b;
        background: #edf1f6;
        font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      }
      header { margin-bottom: 16px; }
      h1 { margin: 0 0 5px; font-size: 20px; }
      p { margin: 0; color: #66778e; font-size: 12px; }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      figure {
        min-width: 0;
        margin: 0;
        padding: 12px;
        border: 1px solid #d4dce7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 14px 30px -24px rgba(23, 54, 92, .55);
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        margin: 0 2px 10px;
        color: #34516f;
        font-size: 12px;
        font-weight: 700;
      }
      figcaption span { color: #7a8799; font-size: 10px; font-weight: 500; }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 1702 / 1066;
        object-fit: contain;
        border: 1px solid #e1e6ed;
        border-radius: 9px;
        background: #f6f8fb;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>数据与存储窗口：同视口前后对比</h1>
      <p>1702×1066 CSS px · 100% · device scale factor 1</p>
    </header>
    <main>
      <figure>
        <figcaption>问题参考 <span>窗口偏小、操作挤在一行</span></figcaption>
        <img src="/docs/screenshots/final-core-workspace/settings-data-storage-small-crowded-reference.png" alt="调整前的数据与存储窗口" />
      </figure>
      <figure>
        <figcaption>当前实现 <span>大窗口、分层卡片、可调节尺寸</span></figcaption>
        <img src="/docs/screenshots/qa/settings-data-storage-resizable-1702x1066.png" alt="调整后的数据与存储窗口" />
      </figure>
    </main>
  </body>
</html>
