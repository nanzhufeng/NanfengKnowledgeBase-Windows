<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主题结构编辑前后对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 22px; color: #18385f; background: #eef2f7; font-family: "Microsoft YaHei", sans-serif; }
      header { margin-bottom: 16px; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p { margin: 0; color: #67788f; font-size: 13px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; padding: 12px; border: 1px solid #d8e0ea; border-radius: 14px; background: #fff; box-shadow: 0 16px 34px -28px #17375f; }
      figcaption { margin-bottom: 10px; font-size: 14px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e3e8ef; border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>主题结构编辑：参考问题与实现结果</h1>
      <p>左侧是用户指出的顶部按钮堆叠和行内编辑；右侧是编辑态下沉到对应行、详情统一弹窗后的 1702×1066 实现。</p>
    </header>
    <main>
      <figure>
        <figcaption>参考问题</figcaption>
        <img src="/docs/screenshots/final-core-workspace/topic-structure-contextual-edit-dialog-reference.png" alt="参考问题截图" />
      </figure>
      <figure>
        <figcaption>实现结果</figcaption>
        <img src="/docs/screenshots/qa/topic-structure-contextual-edit-1702x1066-final.png" alt="实现结果截图" />
      </figure>
    </main>
  </body>
</html>
